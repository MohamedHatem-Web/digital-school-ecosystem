<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور — منظومة المدرسة الرقمية</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/public-site.css">
  <style>
    .reset-canvas {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary-950) 0%, var(--color-primary-900) 65%, var(--color-primary-850) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }
    .reset-box {
      max-width: 440px;
      width: 100%;
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المدرسة الرقمية">
</head>
<body>

  <div class="reset-canvas">
    <div class="reset-box">
      <div style="margin-bottom: var(--space-4);">
        <a href="login.html" style="font-size: var(--text-xs); color: #cbd5e1; font-weight: 500;">
          ← العودة لصفحة تسجيل الدخول
        </a>
      </div>

      <div class="panel" style="box-shadow: var(--shadow-lg);">
        <div class="panel-header" style="flex-direction: column; text-align: center; padding-block: var(--space-6);">
          <div style="font-size: 2rem; margin-bottom: var(--space-2);">🔑</div>
          <h1 style="font-size: var(--text-lg); font-weight: 800; color: var(--color-primary-950);">
            استعادة كلمة المرور الرسمية
          </h1>
          <p style="font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px;">
            أدخل البريد الإلكتروني المسجل بالمنظومة لتلقي رابط إعادة التعيين الآمن
          </p>
        </div>

        <div class="panel-body">
          <div id="reset-success-alert" class="alert alert-success" style="display: none; margin-bottom: var(--space-4);">
            ✓ تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني بنجاح عبر خوادم Firebase.
          </div>

          <div id="reset-error-alert" class="alert alert-danger" style="display: none; margin-bottom: var(--space-4);">
            <span id="reset-error-text">حدث خطأ أثناء إرسال الرابط.</span>
          </div>

          <form id="reset-form">
            <div class="form-group">
              <label class="form-label" for="reset-email">البريد الإلكتروني المعتمد <span class="required">*</span></label>
              <input type="email" id="reset-email" class="form-control" placeholder="user@dse.edu.eg" required autocomplete="email">
            </div>

            <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-lg btn-full">
              إرسال رابط إعادة التعيين
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requestPasswordReset, translateAuthError } from './js/auth.js';

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('reset-submit-btn');
    const successAlert = document.getElementById('reset-success-alert');
    const errorAlert = document.getElementById('reset-error-alert');
    const errorText = document.getElementById('reset-error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';
      successAlert.style.display = 'none';
      errorAlert.style.display = 'none';

      try {
        await requestPasswordReset(email);
        successAlert.style.display = 'flex';
        form.reset();
      } catch (err) {
        console.error('Password reset error:', err);
        errorText.textContent = translateAuthError(err.code || err.message);
        errorAlert.style.display = 'flex';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال رابط إعادة التعيين';
      }
    });
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js?v=6.0')}</script>
</body>
</html>
