<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير مصرح بالدخول — منظومة المدرسة الرقمية</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .unauth-canvas {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background-color: var(--bg-page);
    }
    .unauth-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-8);
      box-shadow: var(--shadow-md);
    }
  </style>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المدرسة الرقمية">
</head>
<body>

  <div class="unauth-canvas">
    <div class="unauth-card">
      <div style="font-size: 3rem; margin-bottom: var(--space-3);">🛡️</div>
      <h1 style="font-size: var(--text-xl); font-weight: 800; color: var(--color-danger-solid); margin-bottom: var(--space-2);">
        غير مصرح بالدخول لهذا القسم
      </h1>
      <p style="font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--leading-relaxed); margin-bottom: var(--space-6);">
        حسابك الحالي لا يملك الصلاحيات الإدارية المطلوبة للوصول لهذه السجلات. تم حظر الطلب وتسجيله لحماية خصوصية وسرية بيانات المدرسة.
      </p>
      <div style="display: flex; justify-content: center; gap: var(--space-3);">
        <a href="admin-overview.html" id="back-my-dashboard-btn" class="btn btn-primary btn-md">العودة لمساحتي المصرح بها</a>
        <a href="../login.html" class="btn btn-outline btn-md">تسجيل الخروج</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { getCurrentRole, getRoleDashboardUrl } from '../js/auth.js';
    const role = getCurrentRole();
    if (role) {
      const target = getRoleDashboardUrl(role).replace('dashboard/', '');
      document.getElementById('back-my-dashboard-btn').href = target;
    }
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js?v=6.0')}</script>
</body>
</html>
