name = "dse-cloudinary-gateway"
main = "worker.js"
compatibility_date = "2024-04-01"

[vars]
CORS_ORIGIN = "https://digital-school-platform.vercel.app,https://digital-school-ecosystem.web.app,https://digital-school-ecosystem.firebaseapp.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500"
CLOUDINARY_CLOUD_NAME = "arjlacyo"
FIREBASE_PROJECT_ID = "digital-school-ecosystem"
FIREBASE_WEB_API_KEY = "AIzaSyBD4WFrHSJB5EjpFwsOnlPzNCxf91vEyQw"
DEFAULT_SCHOOL_ID = "zewail-school"
FAMILY_ACTIVATION_CONTINUE_URL = "https://digital-school-ecosystem.web.app/login.html?flow=parent-activation"
PLATFORM_CONTINUE_BASE = "https://digital-school-platform.vercel.app"

[[ratelimits]]
name = "FAMILY_ACTIVATION_LIMITER"
namespace_id = "9473218016"

	[ratelimits.simple]
	limit = 8
	period = 60

[[ratelimits]]
name = "PUBLIC_CONTACT_LIMITER"
namespace_id = "9473218017"

	[ratelimits.simple]
	limit = 6
	period = 60

[[ratelimits]]
name = "SCHOOL_APPLICATION_LIMITER"
namespace_id = "9473218018"

	[ratelimits.simple]
	limit = 3
	period = 60

# Configure encrypted secrets only after rotating the previously exposed credentials:
# npx wrangler secret put CLOUDINARY_API_KEY
# npx wrangler secret put CLOUDINARY_API_SECRET
# npx wrangler secret put FIREBASE_ADMIN_SERVICE_ACCOUNT

